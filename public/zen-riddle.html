<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Riddle - Zen Arcade</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        #puzzle-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #riddle-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 30px;
            max-width: 600px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #question {
            font-size: 1.5rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        #chat {
            height: 200px;
            overflow-y: auto;
            margin-bottom: 20px;
            text-align: left;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        .msg {
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .system {
            color: #aaa;
            font-style: italic;
        }

        .user {
            color: #7af;
            font-weight: 600;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px 20px;
            border-radius: 15px;
            color: white;
            font-family: inherit;
            outline: none;
        }

        input:focus {
            border-color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

<body>
    <div id="ui">
        <a href="/"
            style="pointer-events: auto; color: rgba(255,255,255,0.5); text-decoration: none; font-size: 0.9rem; margin-bottom: 10px; display: block;">←
            Quay lại</a>
        <h1>Zen Riddle</h1>
        <p>Cùng nhau giải những câu đố cổ xưa...</p>
    </div>
    <div id="puzzle-container">
        <div id="riddle-box">
            <div id="question">Đang tải câu đố...</div>
            <div id="chat"></div>
            <input type="text" id="answer" placeholder="Nhập câu trả lời của bạn..." autocomplete="off">
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io('/riddle');
        const qEl = document.getElementById('question');
        const chatEl = document.getElementById('chat');
        const inputEl = document.getElementById('answer');

        socket.on('newRiddle', (q) => {
            qEl.innerText = q;
            chatEl.innerHTML += `<div class="msg system">Câu đố mới đã bắt đầu!</div>`;
        });

        socket.on('message', (data) => {
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = `<span class="user">${data.user}:</span> ${data.text}`;
            chatEl.appendChild(div);
            chatEl.scrollTop = chatEl.scrollHeight;
        });

        socket.on('solved', (data) => {
            chatEl.innerHTML += `<div class="msg system" style="color: #6f6;">Chúc mừng! ${data.user} đã giải đúng: <b>${data.answer}</b></div>`;
        });

        inputEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && inputEl.value.trim()) {
                socket.emit('guess', inputEl.value.trim());
                inputEl.value = '';
            }
        });
    </script>
    <script src="theme.js"></script>
</body>

</html>

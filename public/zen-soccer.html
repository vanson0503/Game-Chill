<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Zen Soccer - Bóng Đá Thư Giãn</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
    <style>
        body {
            overflow: hidden;
            margin: 0;
            background: #0a2e0a;
            color: white;
            font-family: 'Outfit', sans-serif;
        }

        canvas {
            display: block;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-sizing: border-box;
        }

        #ui {
            position: fixed;
            top: 20px;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }

        .score {
            font-size: 3rem;
            font-weight: 700;
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        .score span {
            background: rgba(0, 0, 0, 0.3);
            padding: 0 20px;
            border-radius: 10px;
        }

        .hint {
            font-size: 1rem;
            opacity: 0.8;
            margin-top: 10px;
        }

        .back-link {
            position: fixed;
            top: 20px;
            right: 80px;
            color: white;
            text-decoration: none;
            z-index: 100;
            font-weight: 600;
        }

        /* Soccer Pitch Lines */
        #pitch-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 1000px;
            height: 600px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            z-index: -1;
        }

        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        .center-line {
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body>
    <div id="ui">
        <div class="score">
            <span id="score-left">0</span>
            <span id="score-right">0</span>
        </div>
        <div class="hint">Dẫn bóng vào gôn đối phương để ghi điểm! ⚽</div>
    </div>
    <a href="/" class="back-link">← Quay lại</a>
    <div id="theme-btn" onclick="toggleTheme()">🌙 Zen Mode</div>
    <div id="canvas-container" style="display: flex; justify-content: center; align-items: center; height: 100vh;">
        <canvas id="gameCanvas" width="1000" height="600"></canvas>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="theme.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreL = document.getElementById('score-left');
        const scoreR = document.getElementById('score-right');
        const socket = io('/soccer');

        let ball = { x: 500, y: 300 };
        let players = {};
        let mouse = { x: 500, y: 300 };

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
            socket.emit('move', mouse);
        });

        socket.on('init', (data) => {
            ball = data.ball;
            players = data.players;
            scoreL.innerText = data.score.left;
            scoreR.innerText = data.score.right;
        });

        socket.on('update', (data) => {
            ball = data.ball;
            players = data.players;
        });

        socket.on('goal', (score) => {
            scoreL.innerText = score.left;
            scoreR.innerText = score.right;
            // Shaking effect maybe?
            canvas.style.animation = 'shake 0.5s';
            setTimeout(() => canvas.style.animation = '', 500);
        });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Pitch background details
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 2;
            ctx.strokeRect(0, 0, 1000, 600);
            ctx.beginPath(); ctx.moveTo(500, 0); ctx.lineTo(500, 600); ctx.stroke();
            ctx.beginPath(); ctx.arc(500, 300, 75, 0, Math.PI * 2); ctx.stroke();

            // Goals
            ctx.fillStyle = 'rgba(255,255,255,0.05)';
            ctx.fillRect(0, 200, 20, 200);
            ctx.fillRect(980, 200, 20, 200);

            // Draw Players
            Object.values(players).forEach(p => {
                ctx.save();
                ctx.beginPath();
                ctx.arc(p.x, p.y, 25, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = p.color;
                ctx.fill();
                ctx.restore();
            });

            // Draw Ball
            ctx.save();
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, 15, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.shadowBlur = 20;
            ctx.shadowColor = 'white';
            ctx.fill();

            // Ball pattern
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 1;
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.moveTo(ball.x, ball.y);
                ctx.lineTo(ball.x + Math.cos(i * 1.2) * 15, ball.y + Math.sin(i * 1.2) * 15);
                ctx.stroke();
            }
            ctx.restore();

            requestAnimationFrame(draw);
        }
        draw();
    </script>
    <style>
        @keyframes shake {
            0% {
                transform: translate(1px, 1px) rotate(0deg);
            }

            10% {
                transform: translate(-1px, -2px) rotate(-1deg);
            }

            20% {
                transform: translate(-3px, 0px) rotate(1deg);
            }

            30% {
                transform: translate(3px, 2px) rotate(0deg);
            }

            40% {
                transform: translate(1px, -1px) rotate(1deg);
            }

            50% {
                transform: translate(-1px, 2px) rotate(-1deg);
            }

            60% {
                transform: translate(-3px, 1px) rotate(0deg);
            }

            70% {
                transform: translate(3px, 1px) rotate(-1deg);
            }

            80% {
                transform: translate(-1px, -1px) rotate(1deg);
            }

            90% {
                transform: translate(1px, 2px) rotate(0deg);
            }

            100% {
                transform: translate(1px, -2px) rotate(-1deg);
            }
        }
    </style>
</body>

</html>
